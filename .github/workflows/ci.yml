# Lab 10: push to main → install deps → run RAGAS gate (run_eval.py).
# Add repository secrets: GROQ_API_KEY (required). Optional: TAVILY_API_KEY for fuller eval rows.
#
# Breaking-change demo: intentionally lower eval_thresholds.json or corrupt the agent on a branch
# and open a PR; restore thresholds / code on main to go green again.

name: CI Quality Gate

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify GROQ_API_KEY secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Repository secret GROQ_API_KEY is missing. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "GROQ_API_KEY is set (value not shown)."

      - name: Cache Hugging Face hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Install dependencies
        env:
          PIP_DEFAULT_TIMEOUT: "900"
        run: |
          python -m pip install --upgrade pip
          pip install --retries 10 --default-timeout=900 -r requirements.txt

      - name: Run evaluation gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # Fewer rows = faster, fewer Groq/RAGAS flakes on free-tier CI
          CI_EVAL_LIMIT: "3"
          BWA_LLM_GUARD: "0"
          TOKENIZERS_PARALLELISM: "false"
        run: python run_eval.py

      - name: Upload CI eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-eval-results
          if-no-files-found: warn
          path: |
            ci_eval_results.json
            ci_eval_raw.json
            ci_eval_diag.txt
