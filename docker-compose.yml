# Lab 9: multi-service stack — FastAPI agent + Postgres (LangGraph checkpoint store).
# Secrets: pass via shell environment or a local .env file (never COPY .env into the image).
#
# Start:  docker compose up --build -d
# Stop:   docker compose down
# Logs:   docker compose logs -f api
#
# Volumes:
#   postgres_data — checkpoint / graph state (survives container restart)
#   faiss_data      — optional persistence for built FAISS index (speeds cold starts)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bwa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env or environment}
      POSTGRES_DB: ${POSTGRES_DB:-bwa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bwa} -d ${POSTGRES_DB:-bwa}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Required at runtime (not baked into image)
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env or environment}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      POSTGRES_URI: postgresql://${POSTGRES_USER:-bwa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bwa}
      FAISS_INDEX_PATH: /data/faiss_index
      DOMAIN_DOCS_DIR: /app/domain_docs
      BWA_EVAL_SKIP_SAVE: "1"
      BWA_LLM_GUARD: ${BWA_LLM_GUARD:-0}
    # Compose automatically loads a `.env` file next to this YAML for ${VAR} substitution.
    volumes:
      - faiss_data:/data/faiss_index
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  faiss_data:
